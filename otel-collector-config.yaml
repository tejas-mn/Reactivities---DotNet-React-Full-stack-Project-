receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  elasticsearch:
    endpoints:
      - http://elasticsearch:9200
    flush:
      interval: 1s
    logs_index: otel-logs-nanos
    traces_index: otel-traces
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  zipkin:
    endpoint: http://zipkin:9411/api/v2/spans

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [elasticsearch, otlp/jaeger, zipkin]
    logs:
      receivers: [otlp]
      exporters: [elasticsearch]