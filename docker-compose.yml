version: "3.8"

services:

  sql:
    image: mcr.microsoft.com/azure-sql-edge
    environment:
      ACCEPT_EULA: "1"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: always

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      elasticsearch:
        condition: service_started
      elasticsearch-index-template:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
      zipkin:
        condition: service_started
    networks:
      - elk

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks:
      - elk

  zipkin:
    image: openzipkin/zipkin:3.5.1
    ports:
      - "9411:9411"
    networks:
      - elk

  elasticsearch:
    image: elasticsearch:8.7.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - elk

  elasticsearch-index-template:
    image: curlimages/curl:8.12.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "until curl -fsS http://elasticsearch:9200 >/dev/null; do sleep 2; done; curl -fsS -X PUT http://elasticsearch:9200/_index_template/otel-logs-nanos-template -H 'Content-Type: application/json' --data-raw '{\"index_patterns\":[\"otel-logs-nanos*\"],\"priority\":500,\"template\":{\"mappings\":{\"properties\":{\"@timestamp\":{\"type\":\"date_nanos\"}}}}}'"
    depends_on:
      - elasticsearch
    networks:
      - elk

  kibana:
    image: docker.elastic.co/kibana/kibana:8.7.1
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - elk

networks:
  elk:
    driver: bridge

volumes:
  es_data:
    driver: local

  sql_data:
    driver: local